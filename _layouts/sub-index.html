<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJ Aureli - {{ page.title }}</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <header>
            {% include nav.html %}
            <h1>{{ page.title }}</h1>
            {% if page.subheading %}
                <div class="meta-date">{{ page.subheading }}</div>
            {% endif %}
        </header>
        <main>
            {{ content }}
        </main>
        <footer>
            <p>&copy; {{ "now" | date: "%Y" }} AJ Aureli. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
