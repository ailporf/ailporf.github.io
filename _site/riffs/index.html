<!-- Instant Client-Side Reordering Script -->
<script>
document.addEventListener('DOMContentLoaded', () => {
    const btn = document.getElementById('sort-toggle-btn');
    const stream = document.getElementById('riffs-stream');
    
    if (!btn || !stream) return;

    btn.addEventListener('click', () => {
        const currentOrder = btn.getAttribute('data-order');
        const newOrder = currentOrder === 'desc' ? 'asc' : 'desc';
        
        // Toggle button text
        btn.setAttribute('data-order', newOrder);
        btn.textContent = newOrder === 'desc' ? 'NEWEST FIRST [↓]' : 'OLDEST FIRST [↑]';

        // Reorder monthly sections
        const monthBlocks = Array.from(stream.querySelectorAll('.monthly-riff-block'));
        monthBlocks.reverse().forEach(block => stream.appendChild(block));

        // Reorder individual cards within each section
        monthBlocks.forEach(block => {
            const container = block.querySelector('.riffs-group-container');
            if (container) {
                const cards = Array.from(container.querySelectorAll('.archive-riff-card'));
                cards.reverse().forEach(card => container.appendChild(card));
            }
        });
    });
});
</script>
